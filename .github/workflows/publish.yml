name: Publish to VS Code Marketplace

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/check.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate the release version and branch
        run: |
          npm run check:release
          git merge-base --is-ancestor HEAD origin/master
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: search-plus-plus-vsix
          path: .
      - name: Publish the validated VSIX
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::Configure the VSCE_PAT repository secret for Marketplace publishing.'
            exit 1
          fi
          npm run publish:marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
