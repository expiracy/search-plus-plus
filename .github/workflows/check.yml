name: Validate changes

on:
  push:
    branches: ['**', '!master']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: 'Stable version to prepare before validating and packaging a manual release'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  check:
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare a manual release version
        if: inputs.release_version != ''
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check

  extension-host:
    name: VS Code ${{ matrix.vscode }} smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.109.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare a manual release version
        if: inputs.release_version != ''
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: xvfb-run -a npm run test:host
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - run: xvfb-run -a npm run test:ui
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: popup-ui-failure-${{ matrix.vscode }}
          path: .vscode-test/ui-failure-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package VSIX
    needs: [check, extension-host]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare a manual release version
        if: inputs.release_version != ''
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-plus-plus-vsix
          path: search-plus-plus.vsix
          if-no-files-found: error
          retention-days: 14
